function openPlayer(team, player){
  state.showLog=false;
  state.filterPlayer = { team, player, compare:null };
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearPlayerFilter(){
  state.filterPlayer = null;
  render();
}
function setCompare(sel){
  if(!state.filterPlayer) return;
  const name = sel.value;
  if(!name){ state.filterPlayer.compare=null; render(); return; }
  const tm = teamOfPlayer(name);
  if(tm) state.filterPlayer.compare = { team:tm, player:name };
  render();
}
function clearCompare(){
  if(state.filterPlayer){ state.filterPlayer.compare=null; render(); }
}

// Alle relevante spelers in de huidige wedstrijd (beide teams)
function matchupPlayers(){
  const list=[];
  [state.away, state.home].forEach(tm=>{
    if(!tm||!D) return;
    try {
      playerProfiles(tm, state.week).filter(p=>['WR','TE','RB','QB','FB'].includes(p.pos)).forEach(p=>{
        if(!list.some(x=>x.name===p.player)) list.push({name:p.player, team:tm, pos:p.pos});
      });
    } catch(e){}
  });
  return list;
}
function teamOfPlayer(name){
  const m = matchupPlayers().find(x=>x.name===name);
  return m ? m.team : null;
}
function refreshPlayerSearchList(){
  const dl=document.getElementById('playerSearchList'); if(!dl) return;
  dl.innerHTML = matchupPlayers()
    .map(o=>`<option value="${o.name.replace(/"/g,'&quot;')}">${o.team} \u00b7 ${o.pos}</option>`).join('');
}
function doPlayerSearch(val){
  if(!val) return;
  const players = matchupPlayers();
  const low=val.toLowerCase();
  const m = players.find(x=>x.name===val)
         || players.find(x=>x.name.toLowerCase()===low)
         || players.find(x=>x.name.toLowerCase().includes(low));
  const inp=document.getElementById('playerSearch'); if(inp) inp.value='';
  if(m) openPlayer(m.team, m.name);
}

// Bouwt de secties (snap, coverage, rushing, matchup, line) voor 1 speler
function playerDetailSections(team, player){
  const wk = state.week;
  const oppTeam = (team===state.home) ? state.away : state.home;
  const wd = buildWeekData(wk);
  const p = playerProfiles(team, wk).find(x=>x.player===player);
  if(!p) return `<div class="empty">Geen data voor ${player} in deze week.</div>`;

  let html = `<div style="color:var(--dim);font-size:12px;margin-bottom:16px;">${team} \u2014 tegen ${oppTeam} \u00b7 alle cijfers ${wkLbl(wk)}</div>`;

  if(p._oldTeams && p._oldTeams.length){
    html += `<div class="warn-band">\u26a0 Let op: ${p._prevGames} van de ${p.games} wedstrijden hieronder zijn van vorig seizoen bij <b>${p._oldTeams.join(', ')}</b>.
      Volume-cijfers als target share en snap% horen bij die oude rol \u2014 in een nieuwe offense kan dat flink anders liggen.</div>`;
  } else if(p._prevGames && p._prevGames===p.games){
    html += `<div class="warn-band">\u26a0 Alle ${p.games} wedstrijden hieronder komen uit vorig seizoen \u2014 nog geen data in ${D.season}.</div>`;
  }

  // Snap & vorm
  html += `<div class="modal-section"><h3>Snap &amp; vorm</h3>
    <div class="stat-grid">
      <div class="stat-cell"><div class="v">${fmt(p.snap*100,0)}%</div><div class="k">snap (L3)</div></div>
      <div class="stat-cell"><div class="v">${fmt(p.targets,1)}</div><div class="k">tgt/game</div></div>
      <div class="stat-cell"><div class="v">${fmt(p.tgt_share*100,0)}%</div><div class="k">target share</div></div>
      <div class="stat-cell"><div class="v">${fmt(p.rec_yds,0)}</div><div class="k">rec yds/g</div></div>
      <div class="stat-cell"><div class="v">${fmt(p.rec_yds_l3,0)}</div><div class="k">rec yds (L3)</div></div>
      ${(p.pos==='RB'||p.pos==='QB')?`<div class="stat-cell"><div class="v">${fmt(p.rush_yds,0)}</div><div class="k">rush yds/g</div></div>`:''}
    </div>
    <div style="margin-top:12px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;">
      <div><div class="k" style="font-size:10px;color:var(--dim);margin-bottom:4px;">SNAP% VERLOOP</div>${sparkline(p.snapSeries,'snap','var(--blue)',100)}</div>
      <div><div class="k" style="font-size:10px;color:var(--dim);margin-bottom:4px;">TARGETS VERLOOP</div>${sparkline(p.snapSeries,'tgt','var(--accent)')}</div>
    </div></div>`;

  // Coverage (voor WR/TE/RB)
  const c = wd.playerCov[player];
  if(c){
    let man={t:0,y:0}, zone={t:0,y:0};
    Object.entries(c).forEach(([cov,o])=>{
      if(MAN_TYPES.includes(cov)){man.t+=o.targets;man.y+=o.yards;}
      if(ZONE_TYPES.includes(cov)){zone.t+=o.targets;zone.y+=o.yards;}
    });
    const cell=(label,o)=>{
      if(!o||o.targets===0) return `<div class="stat-cell"><div class="v dim">\u2013</div><div class="k">${label}</div></div>`;
      const thin=o.targets<MIN_COV_TARGETS;
      return `<div class="stat-cell"><div class="v" style="${thin?'color:var(--dim)':''}">${fmt(o.yards/o.targets,1)}</div><div class="k">${label} (n=${o.targets})</div></div>`;
    };
    html += `<div class="modal-section"><h3>Yards per target vs coverage</h3><div class="stat-grid">
      ${cell('vs Man',{targets:man.t,yards:man.y})}
      ${cell('vs Zone',{targets:zone.t,yards:zone.y})}
      ${cell('Cover 1',c['COVER_1'])}
      ${cell('Cover 2',c['COVER_2'])}
      ${cell('Cover 3',c['COVER_3'])}
    </div><div style="font-size:11px;color:var(--dim);margin-top:8px;">Grijs = te weinig data (n&lt;${MIN_COV_TARGETS}). Man/Zone het betrouwbaarst.</div></div>`;
  }

  // Speelsituaties: yards per target per situatie, afgezet tegen het
  // eigen gemiddelde van deze speler. Dat maakt het cijfer pas leesbaar:
  // 9.1 ypt zegt weinig, "+1.8 boven zijn eigen gemiddelde" wel.
  const ctx = playContextFor(team, player, wk);
  const ctxKeys = CTX_ORDER.filter(k=>ctx[k] && ctx[k].targets>0);
  if(ctxKeys.length){
    // basislijn = alle targets van de speler samen. Shotgun + under center
    // dekken samen elke pass, dus die twee vormen een sluitend totaal.
    const sg = ctx.shotgun||{targets:0,yards:0}, uc = ctx.under_center||{targets:0,yards:0};
    const totT = sg.targets + uc.targets, totY = sg.yards + uc.yards;
    const basis = totT>0 ? totY/totT : null;

    const cel = (k)=>{
      const o = ctx[k];
      const ypt = o.yards/o.targets;
      const dun = o.targets < MIN_CTX_TARGETS;
      // Aandeel in zijn totale targets: maakt het volume pas leesbaar.
      // 42 targets zegt weinig; "41% van al zijn targets" wel.
      const aandeel = totT>0 ? Math.round(100*o.targets/totT) : null;
      // De yards/target is een SCHATTING: bij weinig targets is die onbetrouwbaar
      // en tonen we hem grijs. Het aantal zelf is een telling en dus altijd hard.
      let yptTxt = `<span style="${dun?'color:var(--dim)':''}">${fmt(ypt,1)} ypt</span>`;
      if(basis!==null && !dun){
        const d = ypt - basis;
        if(Math.abs(d) >= 0.75){
          yptTxt += `<span class="${d>0?'mu-good-t':'mu-bad-t'}"> ${d>0?'+':''}${fmt(d,1)}</span>`;
        }
      }
      return `<div class="stat-cell">
        <div class="v">${o.targets}<span class="ctx-unit">tgt</span></div>
        <div class="k">${CTX_LABELS[k]}${aandeel!==null?` \u00b7 ${aandeel}%`:''}<br>${yptTxt}</div></div>`;
    };
    html += `<div class="modal-section"><h3>Targets per speelsituatie</h3>
      <div class="stat-grid">${ctxKeys.map(cel).join('')}</div>
      <div class="note">Het grote getal is het <b>aantal targets</b> in die situatie, met daaronder het aandeel in zijn ${totT} targets en de yards per target.
      ${basis!==null?`Het groene/rode getal is het verschil met zijn eigen gemiddelde van <b>${fmt(basis,1)}</b> ypt. `:''}
      <span class="thin-t">Grijze ypt</span> = te weinig targets (n&lt;${MIN_CTX_TARGETS}) om iets over efficiëntie te zeggen; het aantal zelf klopt altijd.
      Let op: deze situaties <b>overlappen</b> \u2014 \u00e9\u00e9n play kan tegelijk shotgun, play-action \u00e9n 3rd down zijn, dus ze tellen niet op tot het totaal.</div></div>`;
  }

  // Rushing detail (RB)
  const rb = wd.rbRush[player];
  if(rb && rb.carries>=3){
    html += `<div class="modal-section"><h3>Rushing detail</h3><div class="stat-grid">
      <div class="stat-cell"><div class="v">${fmt(rb.carries,0)}</div><div class="k">carries</div></div>
      <div class="stat-cell"><div class="v">${fmt(rb.ybc_att,1)}</div><div class="k">YBC/att</div></div>
      <div class="stat-cell"><div class="v">${fmt(rb.yac_att,1)}</div><div class="k">YAC/att</div></div>
      <div class="stat-cell"><div class="v">${fmt(rb.broken_pg,1)}</div><div class="k">broken/g</div></div>
    </div></div>`;
  }

  // Matchup: hoe verdedigt de tegenstander deze positie
  const dpos = (wd.teamDef[oppTeam]||{})[p.pos];
  if(dpos){
    html += `<div class="modal-section"><h3>Matchup \u2014 ${oppTeam} tegen ${p.pos}</h3><div class="stat-grid">
      <div class="stat-cell"><div class="v">${fmt(dpos.rec_yds_pg,0)}</div><div class="k">rec yds/g toegestaan</div></div>
      <div class="stat-cell"><div class="v">#${dpos.rec_yds_rank||'\u2013'}</div><div class="k">rank (1=zwakst)</div></div>
      ${p.pos==='RB'?`<div class="stat-cell"><div class="v">${fmt(dpos.rush_yds_pg,0)}</div><div class="k">rush yds/g toegestaan</div></div>`:''}
    </div></div>`;
  }

  // Betting line
  const odds = (D.odds||[]).filter(r=>r.player===player && r.week==wk);
  if(odds.length){
    let orows = odds.map(r=>{
      const lbl = ODDS_LABEL[r.market]||r.market;
      let res = '';
      if(r.result==='Push') res='<span class="dim">push</span>';
      else if(r.result) res=`<span class="${r.result==='Over'?'trend-up':'trend-down'}">${r.result} (${fmt(r.actual,1)})</span>`;
      else res='<span class="dim">nog niet gespeeld</span>';
      return `<div class="stat-cell" style="text-align:left;"><div class="v" style="font-size:16px;">${lbl} ${fmt(r.line,1)}</div><div class="k">O ${fmt(r.price_over,0)} / U ${fmt(r.price_under,0)} \u00b7 ${res}</div></div>`;
    }).join('');
    html += `<div class="modal-section"><h3>Betting line</h3><div class="stat-grid">${orows}</div></div>`;
  }
  return html;
}

function playerColumn(team, player){
  const p = playerProfiles(team, state.week).find(x=>x.player===player);
  const pos = p ? p.pos : '';
  return `<div class="team-scope" style="--team:${teamColor(team)};--team2:${teamColor2(team)}">
    <div class="modal-box filter-box">
      <div class="modal-head">${teamLogo(team,'h2-logo')}<h2>${player} <span class="pos">${pos}</span></h2></div>
      <div class="modal-body">${playerDetailSections(team, player)}</div>
    </div></div>`;
}

function buildPlayerDetail(team, player){
  const cmp = state.filterPlayer && state.filterPlayer.compare;
  const cmpName = cmp ? cmp.player : '';
  const others = matchupPlayers().filter(x=>x.name!==player);
  const opts = ['<option value="">\u2014 vergelijk met\u2026 \u2014</option>']
    .concat(others.map(o=>`<option value="${o.name.replace(/"/g,'&quot;')}" ${o.name===cmpName?'selected':''}>${o.name} (${o.team} ${o.pos})</option>`))
    .join('');
  let head = `<div class="filter-head">
      <button class="btn back-btn" onclick="clearPlayerFilter()">\u2190 Terug naar wedstrijd</button>
      <select class="cmp-sel" onchange="setCompare(this)">${opts}</select>
      ${cmp?`<button class="btn" onclick="clearCompare()">\u2715 vergelijking</button>`:''}
    </div>`;
  let body;
  if(cmp){
    body = `<div class="compare-grid">${playerColumn(team,player)}${playerColumn(cmp.team,cmp.player)}</div>`;
  } else {
    body = playerColumn(team, player);
  }
  return head + body;
}

function render(){
  const app=document.getElementById('app');
  const wk=state.week, home=state.home, away=state.away;

  refreshPlayerSearchList();
  updateHash();

  // Logboek-weergave
  if(state.showLog){ app.innerHTML = buildLogView(); return; }

  // Gefilterde weergave: 1 of 2 spelers
  if(state.filterPlayer){
    const { team, player } = state.filterPlayer;
    // filter wissen als de speler niet in deze wedstrijd zit
    if(team!==home && team!==away){ state.filterPlayer=null; }
    else { app.innerHTML = buildPlayerDetail(team, player); return; }
  }

  const wd=buildWeekData(wk);
  const sigAway = detectSignals(away, home, wk, wd);
  const sigHome = detectSignals(home, away, wk, wd);
  let html=`<div class="matchup-head">
    <div class="team-badge" style="--team:${teamColor(away)};--team2:${teamColor2(away)}">
      ${teamLogo(away,'team-logo')}<span class="team-code">${away||'?'}</span></div>
    <div class="vs">@</div>
    <div class="team-badge" style="--team:${teamColor(home)};--team2:${teamColor2(home)}">
      ${teamLogo(home,'team-logo')}<span class="team-code">${home||'?'}</span></div>
  </div>`;
  html+=`<div class="toolbar"><button class="btn" id="copyBtn" onclick="copyNote()">\ud83d\udccb Kopieer samenvatting</button><button class="btn" onclick="downloadNote()">\u2b07 Download notitie (.txt)</button><button class="btn" onclick="window.print()">\ud83d\udda8 Print / PDF</button><button class="btn" onclick="openLog()">\ud83d\udcd3 Logboek${pickLog.length?` (${pickLog.length})`:''}</button></div>`;
  const rangeTxt = windowWeeks>0
    ? `stats van de <b>laatste ${windowWeeks} weken</b> (t/m week ${wk>1?wk-1:'\u2013'}, telt door over seizoenen)`
    : `alle stats <b>${wk>1?'t/m week '+(wk-1):'(week 1 \u2014 geen voorgaande data)'}</b>`;
  html+=`<div class="legend">Analyse-tool, geen voorspeller. ${rangeTxt} \u2014 je ziet alleen wat je v\u00f3\u00f3r de wedstrijden van week ${wk} wist.</div>`;
  // Samenvatting: wat springt eruit?
  const allNotes = sigAway.notes.concat(sigHome.notes);
  if(allNotes.length){
    html+=`<div class="summary"><div class="summary-head">\u26a1 Wat springt eruit</div><ul>${allNotes.map(x=>`<li>${x}</li>`).join('')}</ul>
      <div class="summary-foot">Signalen die opvallen \u2014 geen advies. Ga zelf de panelen in om ze te wegen.</div></div>`;
  } else {
    html+=`<div class="summary summary-quiet">Geen sterke signalen deze week \u2014 bekijk de panelen zelf.</div>`;
  }
  html+=`<div class="grid2">
    <div>
      ${ts(away, injuryPanel(away,wk))}
      ${ts(away, vacatedPanel(away,wk))}
      ${ts(home, defenseProfilePanel(home,wd))}
      ${ts(home, runDefensePanel(home,wd))}
      ${ts(home, passDefensePanel(home,wd))}
      ${ts(home, defensePanel(home,wd))}
      ${ts(away, formationPanel(away,wd))}
      ${ts(away, rushingPanel(away,wk,wd))}
      ${ts(away, playerPanel(away,wk,sigAway))}
      ${ts(away, coveragePanel(away,home,wk,wd))}
      ${ts(away, playSituationPanel(away,home,wk,wd))}
      ${ts(away, oddsPanel(away,wk))}
    </div>
    <div>
      ${ts(home, injuryPanel(home,wk))}
      ${ts(home, vacatedPanel(home,wk))}
      ${ts(away, defenseProfilePanel(away,wd))}
      ${ts(away, runDefensePanel(away,wd))}
      ${ts(away, passDefensePanel(away,wd))}
      ${ts(away, defensePanel(away,wd))}
      ${ts(home, formationPanel(home,wd))}
      ${ts(home, rushingPanel(home,wk,wd))}
      ${ts(home, playerPanel(home,wk,sigHome))}
      ${ts(home, coveragePanel(home,away,wk,wd))}
      ${ts(home, playSituationPanel(home,away,wk,wd))}
      ${ts(home, oddsPanel(home,wk))}
    </div></div>`;
  app.innerHTML=html;
}

function setSeason(year){
  D = window.NFL_SEASONS[String(year)];
  _weekCache = {};               // cache leegmaken: andere data
  state.filterPlayer = null;     // filter wissen bij nieuw seizoen
  state.showLog = false;
  document.getElementById('seasonInfo').textContent =
    `seizoen ${D.season} \u00b7 ${D.teams.length} teams \u00b7 week-voor-week`;
  // week-dropdown opnieuw vullen
  const weeks = D.weeks;
  // Standaardweek: de eerstvolgende NIET gespeelde week. Bij een afgelopen
  // seizoen is dat de laatste week; bij een lopend seizoen de actuele week.
  const gespeeld = (D.player_weekly||[]).map(r=>+r.week);
  const laatstGespeeld = gespeeld.length ? Math.max(...gespeeld) : 0;
  const kandidaat = weeks.filter(w=>w>laatstGespeeld);
  state.week = kandidaat.length ? kandidaat[0] : weeks[weeks.length-1];
  const weekSel = document.getElementById('weekSel');
  weekSel.innerHTML = weeks.map(w=>`<option value="${w}" ${w===state.week?'selected':''}>Week ${w}</option>`).join('');

  // Nog geen eigen data vóór deze week? Dan is "alles tot nu" leeg. Zet het
  // bereik automatisch op 4 weken, zodat eind vorig seizoen meetelt.
  const eigenData = (D.player_weekly||[]).some(r=>+r.week < state.week);
  if(!eigenData && windowWeeks<=0){
    windowWeeks = 4;
    const rs = document.getElementById('rangeSel');
    if(rs) rs.value = '4';
    _weekCache = {};
  }

  // team-dropdowns opnieuw vullen
  const awaySel = document.getElementById('awaySel');
  const homeSel = document.getElementById('homeSel');
  awaySel.innerHTML = D.teams.map(t=>`<option value="${t}">${t}</option>`).join('');
  homeSel.innerHTML = D.teams.map(t=>`<option value="${t}">${t}</option>`).join('');
  fillGames(); syncManual(); render();
}

function fillGames(){
  const wk = parseInt(document.getElementById('weekSel').value);
  const games = D.schedule.filter(g=>g.week==wk);
  const sel = document.getElementById('gameSel');
  if(games.length){
    sel.innerHTML = games.map((g,i)=>`<option value="${i}">${g.away_team} @ ${g.home_team}</option>`).join('');
    sel.disabled = false; state.away = games[0].away_team; state.home = games[0].home_team;
  } else { sel.innerHTML = `<option>geen schema</option>`; sel.disabled = true; }
}
function syncManual(){
  document.getElementById('awaySel').value = state.away;
  document.getElementById('homeSel').value = state.home;
}

function readHash(){
  const h=location.hash.replace(/^#/,''); if(!h) return {};
  const o={}; h.split('&').forEach(kv=>{ const i=kv.indexOf('='); if(i>0){ o[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); } }); return o;
}
function updateHash(){
  if(!D) return;
  const s=state;
  const parts=[`s=${D.season}`,`w=${s.week}`,`a=${s.away}`,`h=${s.home}`];
  if(windowWeeks>0) parts.push(`r=${windowWeeks}`);
  if(s.filterPlayer){
    parts.push(`p=${encodeURIComponent(s.filterPlayer.player)}`,`pt=${s.filterPlayer.team}`);
    if(s.filterPlayer.compare){ parts.push(`c=${encodeURIComponent(s.filterPlayer.compare.player)}`,`ct=${s.filterPlayer.compare.team}`); }
  }
  try{ history.replaceState(null,'','#'+parts.join('&')); }catch(e){}
}
function applyHashSelection(hs){
  if(!hs || !Object.keys(hs).length) return;
  if(hs.w && D.weeks.includes(parseInt(hs.w))) state.week=parseInt(hs.w);
  if(hs.r){ windowWeeks=parseInt(hs.r)||0; _weekCache={}; }
  const weekSel=document.getElementById('weekSel'); if(weekSel) weekSel.value=state.week;
  const rangeSel=document.getElementById('rangeSel'); if(rangeSel) rangeSel.value=String(windowWeeks);
  fillGames();
  if(hs.a && D.teams.includes(hs.a)) state.away=hs.a;
  if(hs.h && D.teams.includes(hs.h)) state.home=hs.h;
  syncManual();
  if(D.schedule){
    const games=D.schedule.filter(g=>g.week==state.week);
    const gi=games.findIndex(g=>g.away_team===state.away && g.home_team===state.home);
    const gameSel=document.getElementById('gameSel'); if(gameSel && gi>=0) gameSel.value=String(gi);
  }
  if(hs.p && hs.pt){
    state.filterPlayer={team:hs.pt, player:hs.p, compare:null};
    if(hs.c && hs.ct) state.filterPlayer.compare={team:hs.ct, player:hs.c};
  }
  render();
}

function buildControls(){
  const seasons = Object.keys(window.NFL_SEASONS).map(s=>parseInt(s)).sort((a,b)=>a-b);
  const latest = seasons[seasons.length-1];

  const wrap = document.querySelector('.wrap');
  const ctrl = document.createElement('div');
  ctrl.className = 'controls';
  ctrl.innerHTML = `
    <div class="ctrl"><label>Seizoen</label>
      <select id="seasonSel">${seasons.map(s=>`<option value="${s}" ${s===latest?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="ctrl"><label>Week</label><select id="weekSel"></select></div>
    <div class="ctrl"><label>Wedstrijd</label><select id="gameSel"></select></div>
    <div class="ctrl"><label>of handmatig \u2014 uit</label><select id="awaySel"></select></div>
    <div class="ctrl"><label>thuis</label><select id="homeSel"></select></div><div class="ctrl"><label>databereik</label><select id="rangeSel"><option value="0">alles tot nu</option><option value="4">laatste 4 weken</option><option value="6">laatste 6 weken</option><option value="8">laatste 8 weken</option></select></div><div class="ctrl"><label>zoek speler</label><input id="playerSearch" list="playerSearchList" placeholder="naam\u2026" autocomplete="off"><datalist id="playerSearchList"></datalist></div>`;
  wrap.insertBefore(ctrl, document.getElementById('app'));

  document.getElementById('seasonSel').addEventListener('change', e=>setSeason(parseInt(e.target.value)));
  document.getElementById('weekSel').addEventListener('change', e=>{ state.filterPlayer=null; state.showLog=false; state.week=parseInt(e.target.value); fillGames(); syncManual(); render(); });
  document.getElementById('gameSel').addEventListener('change', e=>{
    state.filterPlayer=null; state.showLog=false;
    const wk=parseInt(document.getElementById('weekSel').value);
    const g=D.schedule.filter(x=>x.week==wk)[parseInt(e.target.value)];
    if(g){ state.away=g.away_team; state.home=g.home_team; syncManual(); render(); }
  });
  document.getElementById('awaySel').addEventListener('change', e=>{ state.filterPlayer=null; state.showLog=false; state.away=e.target.value; render(); });
  document.getElementById('homeSel').addEventListener('change', e=>{ state.filterPlayer=null; state.showLog=false; state.home=e.target.value; render(); });
  document.getElementById('rangeSel').addEventListener('change', e=>{ windowWeeks=parseInt(e.target.value); _weekCache={}; render(); });
  const ps=document.getElementById('playerSearch');
  ps.addEventListener('change', ()=>doPlayerSearch(ps.value));
  ps.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doPlayerSearch(ps.value); } });

  const hs = readHash();
  const startSeason = (hs.s && window.NFL_SEASONS[hs.s]) ? parseInt(hs.s) : latest;
  setSeason(startSeason);
  applyHashSelection(hs);
}

function hideSplash(){
  const s=document.getElementById('splash');
  if(s){ s.classList.add('hide'); setTimeout(()=>{ s.style.display='none'; }, 550); }
}

if(!window.NFL_SEASONS || !Object.keys(window.NFL_SEASONS).length){
  const msg=document.getElementById('splashMsg');
  if(msg) msg.innerHTML='\u26a0 Geen seizoensdata gevonden.<br>Draai de builder en zet dashboard_data_2025.js in dezelfde map.';
  const fill=document.querySelector('.splash-fill'); if(fill) fill.style.animation='none';
  document.getElementById('app').innerHTML =
    '<div class="empty">\u26a0 Geen seizoensdata gevonden. Draai de builder (bv. <b>--season 2025</b>) en zorg dat <b>dashboard_data_2025.js</b> in dezelfde map staat.</div>';
} else {
  try { loadScore(); loadLog(); buildControls(); hideSplash(); }
  catch(err){
    hideSplash();
    document.getElementById('app').innerHTML =
      '<div class="empty">\u26a0 Fout: <b>'+err.message+'</b><br>Open console (F12) voor details.</div>';
    console.error(err);
  }
}
</script>
