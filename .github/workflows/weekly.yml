name: Weekly dashboard update

# Draait elke donderdag 08:00 UTC (~09:00/10:00 NL) en kan handmatig gestart
# worden via de "Actions"-tab → "Run workflow".
on:
  schedule:
    - cron: "0 8 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install --quiet pandas pyarrow

      - name: Run weekly pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pipeline/nfl_pipeline.py weekly --dir .

      - name: Log to job summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat weekly_update.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(geen log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit & push
        run: |
          git config user.name  "nfl-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dashboard_data_*.js data/
          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
          else
            git commit -m "Wekelijkse update $(date -u +%Y-%m-%d)"
            git push
          fi
